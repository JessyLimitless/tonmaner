<svg viewBox="0 0 680 330" role="img" aria-label="능력 범위의 세 겹 동심원. 가장 안쪽은 10년 뒤 현금흐름을 확신할 수 있는 진짜 능력 범위이고, 그 바깥은 책 몇 권 읽고 안다고 착각하는 위험 지대이며, 가장 바깥은 모른다는 사실조차 모르는 미지의 영역이다. 파멸은 원이 좁아서가 아니라 두 번째 고리에 발을 들여서 일어난다">
  <defs>
    <marker id="ccArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <circle cx="250" cy="165" r="148" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" stroke-dasharray="5 4" />
  <circle cx="250" cy="165" r="100" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
  <circle cx="250" cy="165" r="52" fill="currentColor" opacity="0.06" />
  <circle cx="250" cy="165" r="52" fill="none" stroke-width="2.6" class="d-accent-stroke" />

  <text x="250" y="160" text-anchor="middle" font-size="11.5" class="d-accent-t">진짜 능력 범위</text>
  <text x="250" y="178" text-anchor="middle" font-size="9.2" class="d-pct">10년 뒤가 보이는 곳</text>

  <text x="250" y="96" text-anchor="middle" font-size="11" fill="currentColor">위험 지대</text>
  <text x="250" y="111" text-anchor="middle" font-size="9.2" class="d-pct">안다고 착각하는 영역</text>

  <text x="250" y="42" text-anchor="middle" font-size="11" class="d-pct">미지의 영역</text>
  <text x="250" y="57" text-anchor="middle" font-size="9.2" class="d-pct">모른다는 것조차 모르는 곳</text>

  <line x1="302" y1="165" x2="420" y2="165" stroke-width="1.6" class="d-accent-stroke" marker-end="url(#ccArrow)" />
  <text x="428" y="156" font-size="11" class="d-accent-t">① 원 안</text>
  <text x="428" y="174" font-size="9.8" class="d-pct">캔디 · 면도날 · 탄산음료 · 자동차 보험</text>
  <text x="428" y="190" font-size="9.8" class="d-pct">경쟁 구도와 원가 구조가 직관적으로 보인다</text>

  <line x1="350" y1="118" x2="420" y2="90" stroke="currentColor" stroke-width="1.3" opacity="0.5" marker-end="url(#ccArrow)" />
  <text x="428" y="80" font-size="11" fill="currentColor">② 위험 지대</text>
  <text x="428" y="98" font-size="9.8" class="d-pct">파멸의 90%가 여기서 일어난다</text>
  <text x="428" y="114" font-size="9.8" class="d-pct">원이 좁아서가 아니라 여기에 발을 들여서</text>

  <line x1="356" y1="238" x2="420" y2="258" stroke="currentColor" stroke-width="1.3" opacity="0.4" stroke-dasharray="4 3" marker-end="url(#ccArrow)" />
  <text x="428" y="252" font-size="11" class="d-pct">③ 원 밖</text>
  <text x="428" y="270" font-size="9.8" class="d-pct">초기 임상 신약 · 차세대 아키텍처 · 초기 암호화폐</text>
  <text x="428" y="286" font-size="9.8" class="d-pct">3~5년 뒤 판도를 누구도 알 수 없다</text>

  <text x="20" y="322" font-size="11" class="d-pct">중요한 것은 원의 크기가 아니라 테두리를 아는 것이다 — 버핏은 자기 원이 좁다는 사실을 평생 인정했다</text>
</svg>
