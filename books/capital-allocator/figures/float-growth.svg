<svg viewBox="0 0 680 330" role="img" aria-label="벅셔 해서웨이의 보험 플로트는 1970년 3900만 달러에서 1980년 2억 3700만, 1990년 16억, 2000년 278억, 2010년 658억을 거쳐 2020년대 중반 1600억 달러 이상으로 반세기에 걸쳐 기하급수적으로 불어났다">
  <text x="20" y="20" font-size="10.5" class="d-pct">세로축은 로그 눈금 — 각 칸은 열 배다. 직선으로 오르면 기하급수 성장이다</text>

  <line x1="86" y1="248" x2="650" y2="248" stroke="currentColor" stroke-width="1" opacity="0.5" />
  <line x1="86" y1="44" x2="86" y2="248" stroke="currentColor" stroke-width="1" opacity="0.5" />

