<svg viewBox="0 0 680 320" role="img" aria-label="중후장대 제조업은 매출을 두 배로 늘리려면 공장과 기계와 재고를 두 배로 늘려야 해서 번 돈이 다시 유형자산에 묶이지만, 씨즈캔디처럼 자본이 가벼운 사업은 추가 설비투자 없이 생산을 늘릴 수 있어 잉여현금 전액이 지주회사로 빠져나와 다른 기업을 사는 총알이 된다">
  <defs>
    <marker id="alArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text x="20" y="22" font-size="11" class="d-pct">매출을 두 배로 늘린다 — 그다음에 벌어지는 일이 갈린다</text>

  <line x1="340" y1="40" x2="340" y2="270" stroke="currentColor" stroke-width="1" opacity="0.25" />

  <text x="20" y="52" font-size="11.5" fill="currentColor" opacity="0.8">중후장대 제조업 — 벅셔 방직</text>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.45">
    <rect x="20" y="62" width="290" height="38" />
    <rect x="20" y="122" width="290" height="38" />
    <rect x="20" y="182" width="290" height="38" />
  </g>
  <g font-size="10.5" fill="currentColor">
    <text x="34" y="86">공장 2배 · 기계 2배 · 재고 2배</text>
    <text x="34" y="146">번 돈이 다시 유형자산으로</text>
    <text x="34" y="206">주주에게 가는 현금</text>
  </g>
  <text x="296" y="206" text-anchor="end" font-size="13" fill="currentColor" opacity="0.8">0</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <line x1="165" y1="100" x2="165" y2="118" marker-end="url(#alArrow)" />
    <line x1="165" y1="160" x2="165" y2="178" marker-end="url(#alArrow)" />
  </g>
  <path d="M 300 141 L 320 141 L 320 70 L 306 70" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" marker-end="url(#alArrow)" />

  <text x="370" y="52" font-size="11.5" class="d-accent-t">자본이 가벼운 사업 — 씨즈캔디</text>
  <g fill="none" stroke-width="2" class="d-accent-stroke">
    <rect x="370" y="62" width="290" height="38" />
    <rect x="370" y="122" width="290" height="38" />
    <rect x="370" y="182" width="290" height="38" />
  </g>
  <g font-size="10.5" class="d-accent-t">
    <text x="384" y="86">유휴 설비와 효율화만으로 증산</text>
    <text x="384" y="146">추가 설비투자 ≈ 0</text>
    <text x="384" y="206">주주에게 가는 현금</text>
  </g>
  <text x="646" y="207" text-anchor="end" font-size="13" class="d-accent-t">잉여현금 100%</text>
  <g fill="none" stroke-width="1.6" class="d-accent-stroke">
    <line x1="515" y1="100" x2="515" y2="118" marker-end="url(#alArrow)" />
    <line x1="515" y1="160" x2="515" y2="178" marker-end="url(#alArrow)" />
    <line x1="515" y1="220" x2="515" y2="244" marker-end="url(#alArrow)" />
  </g>

  <rect x="370" y="248" width="290" height="34" fill="none" stroke-width="2" class="d-accent-stroke" />
  <text x="515" y="270" text-anchor="middle" font-size="11" class="d-accent-t">코카콜라 · 워싱턴 포스트를 살 총알</text>

  <text x="20" y="308" font-size="11" class="d-pct">한쪽은 번 돈이 기계에 잠기고, 다른 쪽은 번 돈이 다음 기업을 산다 — 같은 이익률이어도 결과가 다른 이유다</text>
</svg>
