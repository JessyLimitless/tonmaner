    <text x="196" y="146" text-anchor="end" class="d-pct">50–67%</text>
    <rect x="16" y="162" width="12" height="12" fill="currentColor" opacity="0.18" />
    <text x="36" y="172">비유동자산</text>
    <text x="196" y="172" text-anchor="end" class="d-zero">0%</text>
  </g>
  <line x1="16" y1="310" x2="656" y2="310" stroke="currentColor" stroke-width="1" opacity="0.35" />
  <g class="d-bar1">
    <rect x="230" y="40"  width="76" height="50"  fill="currentColor" opacity="0.85" />
    <rect x="230" y="90"  width="76" height="55"  fill="currentColor" opacity="0.60" />
    <rect x="230" y="145" width="76" height="65"  fill="currentColor" opacity="0.40" />
    <rect x="230" y="210" width="76" height="100" fill="currentColor" opacity="0.18" />
  </g>
  <g class="d-bar2">
    <rect x="396" y="179" width="76" height="50" fill="currentColor" opacity="0.85" />
    <rect x="396" y="229" width="76" height="43" fill="currentColor" opacity="0.60" />
    <rect x="396" y="272" width="76" height="38" fill="currentColor" opacity="0.40" />
  </g>
  <g class="d-bar3">
    <rect x="562" y="179" width="76" height="71" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
    <text x="600" y="219" text-anchor="middle" font-size="11" opacity="0.6">총부채</text>
    <rect x="562" y="250" width="76" height="60" class="d-accent" />
  </g>
  <line x1="312" y1="152" x2="390" y2="152" stroke="currentColor" stroke-width="1.2" marker-end="url(#dArrow)" />
  <text x="351" y="140" text-anchor="middle" font-size="11.5">자산 할인·삭제</text>
  <line x1="478" y1="152" x2="556" y2="152" stroke="currentColor" stroke-width="1.2" marker-end="url(#dArrow)" />
  <text x="517" y="140" text-anchor="middle" font-size="11.5">총부채 차감</text>
  <g font-size="12.5" text-anchor="middle">
    <text x="268" y="332">회계 장부</text>
    <text x="434" y="332">그레이엄 인정</text>
    <text x="600" y="332" class="d-accent-t">NCAV</text>
  </g>
  <g font-size="11" text-anchor="middle" opacity="0.55">
    <text x="268" y="350">액면 그대로</text>
    <text x="434" y="350">유동자산만</text>
