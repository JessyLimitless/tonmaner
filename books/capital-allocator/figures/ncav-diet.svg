<svg viewBox="0 0 680 372" role="img" aria-label="회계 장부상의 자산이 그레이엄의 자산 할인과 총부채 전액 차감을 거쳐 NCAV로 줄어드는 과정" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <g class="d-legend" font-size="12">
    <rect x="16" y="84" width="12" height="12" fill="currentColor" opacity="0.85" />
    <text x="36" y="94">현금·유가증권</text>
    <text x="196" y="94" text-anchor="end" class="d-pct">100%</text>
