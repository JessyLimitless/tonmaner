<svg viewBox="0 0 680 320" role="img" aria-label="반도체 기업의 미래 현금흐름은 해가 갈수록 진폭이 부채꼴로 벌어져 7년 이후에는 0에서 20억 달러 사이 어디든 가능하지만, 리글리 껌은 좁은 띠 안에서 완만하게 상승해 10년 뒤 값을 95퍼센트 확률로 확정할 수 있다. 그 차이가 할인율을 가르고 영구 잔존가치를 살리거나 죽인다">
  <text x="20" y="20" font-size="10.5" class="d-pct">가로축은 10년. 세로축은 그해에 벌어들일 현금흐름의 가능한 범위다</text>

  <line x1="60" y1="150" x2="330" y2="150" stroke="currentColor" stroke-width="1" opacity="0.4" />
  <text x="60" y="44" font-size="11.5" fill="currentColor">첨단 반도체 — 변화가 빠른 산업</text>

  <path d="M 70 148 L 150 120 L 230 138 L 320 52 L 320 240 L 230 176 L 150 162 Z"
        fill="currentColor" opacity="0.10" />
  <path d="M 70 148 L 150 120 L 230 138 L 320 52" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55" stroke-dasharray="5 4" />
  <path d="M 70 148 L 150 162 L 230 176 L 320 240" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55" stroke-dasharray="5 4" />
  <path d="M 70 148 L 150 141 L 230 157 L 320 146" fill="none" stroke="currentColor" stroke-width="2" opacity="0.75" />

  <text x="326" y="50" font-size="9.5" class="d-pct">최대 \$20억</text>
  <text x="326" y="244" font-size="9.5" class="d-pct">최소 \$0</text>
  <text x="196" y="264" text-anchor="middle" font-size="10" class="d-pct">7년 차 이후 — 생존 여부조차 불투명</text>
  <text x="60" y="286" font-size="10.5" class="d-accent-t">할인율 15~20% 적용 → 먼 미래 현금흐름의 현재가치가 0으로 증발</text>

  <line x1="350" y1="44" x2="350" y2="290" stroke="currentColor" stroke-width="1" opacity="0.25" />

  <line x1="390" y1="220" x2="660" y2="220" stroke="currentColor" stroke-width="1" opacity="0.4" />
  <text x="390" y="44" font-size="11.5" class="d-accent-t">리글리 껌 · 질레트 — 변하지 않는 산업</text>

  <path d="M 400 200 L 480 190 L 560 176 L 650 158 L 650 178 L 560 194 L 480 206 Z"
        fill="currentColor" opacity="0.10" />
  <path d="M 400 200 L 480 190 L 560 176 L 650 158" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45" stroke-dasharray="4 3" />
  <path d="M 400 200 L 480 206 L 560 194 L 650 178" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45" stroke-dasharray="4 3" />
  <path d="M 400 200 L 480 198 L 560 185 L 650 168" fill="none" stroke-width="2.4" class="d-accent-stroke" />

  <text x="656" y="152" text-anchor="end" font-size="9.5" class="d-pct">10년 차 \$4.5억 — 확률 95% 이상</text>
  <text x="524" y="264" text-anchor="middle" font-size="10" class="d-pct">인간의 턱관절과 단맛 선호는 진화하지 않는다</text>
  <text x="390" y="286" font-size="10.5" class="d-accent-t">할인율 8~9% 적용 → 영구 잔존가치가 고스란히 기업 가치로 인정</text>

  <text x="20" y="312" font-size="11" class="d-pct">불확실성은 분자를 줄이는 것이 아니라 분모를 키운다 — 그래서 먼 미래가 통째로 지워진다</text>
</svg>
