<svg viewBox="0 0 680 330" role="img" aria-label="50퍼센트 할인에 산 자본수익률 6퍼센트 기업의 연환산 수익률은 1년 차 112퍼센트에서 시작하지만 해가 갈수록 급격히 내려앉아 30년 차에는 8.5퍼센트가 되고, 정가에 산 자본수익률 20퍼센트 기업은 내내 20퍼센트를 유지해 약 5.6년째에 두 선이 교차한다">
  <defs>
    <marker id="rcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <text x="20" y="20" font-size="10.5" class="d-pct">세로축 — 투자자가 실제로 손에 쥐는 연환산 수익률(CAGR)</text>

  <line x1="70" y1="250" x2="650" y2="250" stroke="currentColor" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="40" x2="70" y2="250" stroke="currentColor" stroke-width="1" opacity="0.5" />

  <g font-size="9.5" class="d-pct" text-anchor="end">
    <text x="62" y="58">120%</text>
    <text x="62" y="145">70%</text>
    <text x="62" y="219">20%</text>
    <text x="62" y="253">0%</text>
  </g>

  <polyline points="90,54 160,163 220,191 300,212 420,226 540,233 620,235"
            fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.6" stroke-dasharray="6 4" />
  <line x1="90" y1="215" x2="620" y2="215" stroke-width="2.4" class="d-accent-stroke" />

  <circle cx="315" cy="215" r="5" fill="none" stroke-width="2" class="d-accent-stroke" />
  <line x1="315" y1="215" x2="315" y2="272" stroke="currentColor" stroke-width="1" opacity="0.5" stroke-dasharray="4 3" />
  <text x="315" y="288" text-anchor="middle" font-size="10" class="d-accent-t">약 5.6년째 역전</text>

  <text x="96" y="46" font-size="11" fill="currentColor" opacity="0.75">112%</text>
  <text x="628" y="239" font-size="11" fill="currentColor" opacity="0.75">8.5%</text>
  <text x="628" y="211" font-size="11" class="d-accent-t">20%</text>

  <g text-anchor="middle" font-size="10" fill="currentColor">
    <text x="90" y="266">1년</text>
    <text x="160" y="266">2년</text>
    <text x="220" y="266">3년</text>
    <text x="420" y="266">10년</text>
    <text x="540" y="266">20년</text>
    <text x="620" y="266">30년</text>
  </g>

  <g font-size="10.5">
    <line x1="330" y1="76" x2="348" y2="76" stroke="currentColor" stroke-width="1.8" opacity="0.6" stroke-dasharray="6 4" />
    <text x="356" y="80" fill="currentColor" opacity="0.75">전략 A — ROIC 6% 기업을 50% 할인에 매수</text>
    <line x1="330" y1="98" x2="348" y2="98" stroke-width="2.4" class="d-accent-stroke" />
    <text x="356" y="102" class="d-accent-t">전략 B — ROIC 20% 기업을 정가에 매수</text>
  </g>

  <text x="20" y="310" font-size="11" class="d-pct">할인은 1회성 보너스라 시간에 희석되고, 투하자본이익률은 매년 다시 작동한다</text>
</svg>
