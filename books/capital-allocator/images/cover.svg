<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2560" width="1600" height="2560">
  <defs>
    <!-- 바탕: 차가운 상아빛 — 회계장부의 종이색 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F4F3EF"/>
      <stop offset="0.55" stop-color="#ECEBE5"/>
      <stop offset="1" stop-color="#DEDCD3"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- 원장 괘선 — 종이 질감으로만. 도해가 아니다 -->
  <g stroke="#191919" stroke-width="1" opacity="0.03">
    <path d="M160 0v2560M480 0v2560M800 0v2560M1120 0v2560M1440 0v2560"/>
  </g>

  <!-- 판면 시작선 -->
  <path d="M96 300v1960" stroke="#2B3A55" stroke-width="2" opacity="0.28"/>

  <!-- ── 브랜드 로크업 ─────────────────────────────── -->
  <g transform="translate(160,222)">
    <rect x="0" y="-20" width="20" height="20" fill="#2B3A55"/>
    <rect x="26" y="-20" width="8" height="20" fill="#2B3A55" opacity="0.45"/>
    <text x="52" y="-2" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="26" letter-spacing="7" fill="#2B3A55" opacity="0.72">CAPITAL ALLOCATOR</text>
  </g>

  <!-- ── 표제 ──────────────────────────────────────── -->
  <text x="160" y="1000" font-family="KoPubWorldBatang, 'Noto Serif KR', serif"
        font-size="196" font-weight="700" fill="#191919" letter-spacing="-4">버핏의</text>
  <text x="160" y="1208" font-family="KoPubWorldBatang, 'Noto Serif KR', serif"
        font-size="196" font-weight="700" fill="#191919" letter-spacing="-4">자본 배치학</text>

  <!-- 강조 밑선 -->
  <path d="M160 1274h430" stroke="#2B3A55" stroke-width="7"/>

  <!-- ── 부제 ──────────────────────────────────────── -->
  <text x="160" y="1396" font-family="KoPubWorldDotum, 'Noto Sans KR', sans-serif"
        font-size="46" fill="#3C4148" opacity="0.92">100년 기업을 발굴하고</text>
  <text x="160" y="1466" font-family="KoPubWorldDotum, 'Noto Sans KR', sans-serif"
        font-size="46" fill="#3C4148" opacity="0.92">복리를 완성하는 4단계 메커니즘</text>

  <!-- ── 하단 ──────────────────────────────────────── -->
  <path d="M160 2286h1280" stroke="#2B3A55" stroke-width="1.5" opacity="0.28"/>
  <text x="160" y="2372" font-family="KoPubWorldBatang, 'Noto Serif KR', serif"
        font-size="52" fill="#191919" opacity="0.9">지은이</text>
  <text x="1440" y="2372" text-anchor="end" font-family="KoPubWorldDotum, 'Noto Sans KR', sans-serif"
        font-size="40" fill="#3C4148" opacity="0.72">펴낸곳</text>
</svg>
