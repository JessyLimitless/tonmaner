<svg viewBox="0 0 440 522" role="img" aria-label="오버행 타이머 역산과 3분할 익절 프로토콜. 납입일에서 1년 뒤 전환청구 개시일을 향해 D-21에 전고점 돌파 시 30퍼센트, D-14에 호재 방출 시 40퍼센트, D-7에 잔량 30퍼센트를 매도한다. 이후 세력의 전환청구 공시와 D-2 권리매도 폭탄이 온다">
  <defs>
    <marker id="epArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <!-- 세로 시간축 -->
  <path d="M 60 24 V 398" stroke="currentColor" stroke-width="1.3" opacity="0.5" marker-end="url(#epArrow)" />
  <g fill="currentColor" opacity="0.6">
    <circle cx="60" cy="40" r="5" />
    <circle cx="60" cy="320" r="5" />
    <circle cx="60" cy="370" r="5" />
  </g>
  <g class="d-accent">
    <circle cx="60" cy="137" r="6" />
    <circle cx="60" cy="201" r="6" />
    <circle cx="60" cy="265" r="6" />
  </g>
  <!-- 납입일 -->
  <text x="76" y="45" font-size="12.5" font-weight="700" fill="currentColor">납입일</text>
  <text x="76" y="62" font-size="11.5" class="d-pct">D-Day 역산 캘린더 켜기</text>
  <g font-size="11.5" class="d-pct">
    <text x="76" y="88">유예 기간(Grace Period) —</text>
    <text x="76" y="104">세력이 주가를 띄워야만 하는 런웨이</text>
  </g>
  <!-- 3분할 -->
  <g class="d-accent">
    <rect x="76" y="112" width="348" height="50" />
    <rect x="76" y="176" width="348" height="50" />
    <rect x="76" y="240" width="348" height="50" />
  </g>
  <g font-size="13" font-weight="700" class="d-on-accent">
    <text x="90" y="133">D-21 · 30%</text>
    <text x="90" y="197">D-14 · 40%</text>
    <text x="90" y="261">D-7 · 30%</text>
  </g>
  <g font-size="11.5" class="d-on-accent">
    <text x="90" y="151">전고점 돌파 시 · 1차 알람 · 채비</text>
    <text x="90" y="215">호재 방출 시 · 데드라인 · 핵심 엑시트</text>
    <text x="90" y="279">잔량 · 5일선 이탈 기준 트레일링</text>
  </g>
  <!-- 전환청구 개시일 -->
  <text x="76" y="325" font-size="12.5" font-weight="700" fill="currentColor">전환청구 개시일</text>
  <text x="76" y="342" font-size="11.5" class="d-pct">납입일 + 1년 · 기습 공시</text>
  <!-- D-2 -->
  <text x="76" y="375" font-size="12.5" font-weight="700" fill="currentColor">D-2 권리매도 갭다운</text>

  <!-- 원칙 -->
  <path d="M 16 410 H 424" stroke="currentColor" stroke-width="0.6" opacity="0.25" />
  <text x="16" y="434" font-size="13" font-weight="700" class="d-accent-t">반 발짝 선제 탈출 (Half-step Ahead)</text>
  <text x="16" y="452" font-size="12" class="d-accent-t">세력의 엑시트 단가보다 아래에서 확정 수익을 챙긴다</text>
  <g font-size="11.5" class="d-pct">
    <text x="16" y="478">호재 폭발 시 시장가 매도 · 체결강도 역전 매도</text>
    <text x="16" y="494">남긴 패(Remaining Overhang)와 다음 회차(N+1) 간격까지</text>
    <text x="16" y="510">캘린더에 매핑</text>
  </g>
</svg>
