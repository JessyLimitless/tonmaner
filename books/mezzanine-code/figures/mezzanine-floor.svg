<svg viewBox="0 0 440 290" role="img" aria-label="건물의 1층 부채와 2층 자본 사이에 놓인 중간층 메자닌. 주가가 하락하면 채권의 형태로 원금과 이자를 보장받고, 주가가 폭등하면 주식으로 갈아타 시세차익을 노리는 양방향 수익 구조">
  <defs>
    <marker id="mfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <!-- 건물 세 층 -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <rect x="16" y="16" width="284" height="64" />
    <rect x="16" y="168" width="284" height="64" />
  </g>
  <rect x="16" y="92" width="284" height="64" fill="none" stroke-width="2.2" class="d-accent-stroke" />
  <g font-size="11" class="d-pct">
    <text x="30" y="36">2층</text>
    <text x="30" y="112">중간층</text>
    <text x="30" y="188">1층</text>
  </g>
  <g font-size="15" fill="currentColor" font-weight="700">
    <text x="30" y="62">자본 (Equity)</text>
    <text x="30" y="214">부채 (Debt)</text>
  </g>
  <text x="30" y="138" font-size="15" font-weight="700" class="d-accent-t">메자닌 (Mezzanine)</text>
  <g font-size="12" class="d-pct" text-anchor="end">
    <text x="288" y="62">주식 · 시세차익</text>
    <text x="288" y="138">CB · BW · EB</text>
    <text x="288" y="214">이자 · 원금 상환</text>
  </g>

  <!-- 양방향 화살표 -->
  <g fill="none" stroke-width="2" class="d-accent-stroke">
    <path d="M 316 112 C 340 112 340 60 340 50" marker-end="url(#mfArrow)" />
    <path d="M 316 136 C 340 136 340 188 340 198" marker-end="url(#mfArrow)" />
  </g>
  <g font-size="13" font-weight="700" class="d-accent-t">
    <text x="352" y="30">주가 폭등</text>
    <text x="352" y="224">주가 하락</text>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="352" y="48">주식으로</text>
    <text x="352" y="64">갈아탄다</text>
    <text x="352" y="182">채권으로</text>
    <text x="352" y="198">남는다</text>
  </g>
  <text x="16" y="266" font-size="12" class="d-pct">스마트 머니가 장부 속에 숨어드는 이유 — 양방향 수익 구조</text>
</svg>
