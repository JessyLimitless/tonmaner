<svg viewBox="0 0 440 484" role="img" aria-label="위쪽은 전환사채 차익거래. 전환권 롱과 주식 공매도 숏을 합치면 주가가 내려도 오르도 수익이 나는 합성 무위험 채권이 된다. 아래쪽은 숏 스퀴즈. 대차잔고로 역산한 공매도 평균 단가 10,000원을 주가가 뚫으면 숏 세력이 강제로 되사며 폭등한다">
  <defs>
    <marker id="dhArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <!-- 위: 델타 헤징 -->
  <text x="16" y="24" font-size="13" font-weight="700" fill="currentColor">델타 헤징 — 세력의 양방향 플레이</text>
  <rect x="16" y="36" width="190" height="48" fill="none" stroke-width="1.8" class="d-accent-stroke" />
  <text x="111" y="56" font-size="12.5" font-weight="700" text-anchor="middle" class="d-accent-t">CB 인수 (전환권)</text>
  <text x="111" y="74" font-size="11.5" text-anchor="middle" class="d-pct">롱(Long)</text>
  <text x="220" y="67" font-size="18" text-anchor="middle" fill="currentColor">+</text>
  <rect x="234" y="36" width="190" height="48" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" />
  <text x="329" y="56" font-size="12.5" font-weight="700" text-anchor="middle" fill="currentColor">주식 공매도</text>
  <text x="329" y="74" font-size="11.5" text-anchor="middle" class="d-pct">숏(Short) · 대차잔고 급증</text>
  <path d="M 220 86 V 100" stroke="currentColor" stroke-width="1.2" opacity="0.6" fill="none" marker-end="url(#dhArrow)" />
  <rect x="16" y="104" width="408" height="34" class="d-accent" />
  <text x="220" y="126" font-size="13" font-weight="700" text-anchor="middle" class="d-on-accent">합성 무위험 채권</text>
  <g font-size="12.5" fill="currentColor">
    <text x="16" y="162">주가 ↓ → 공매도 수익으로 방어</text>
    <text x="16" y="180">주가 ↑ → 싼 전환 주식으로 차익</text>
  </g>
  <g font-size="11.5" class="d-pct">
    <text x="16" y="204">오를 만하면 헤징 물량이 쏟아진다</text>
    <text x="16" y="220">= 주가 상방 캡 (Ceiling Effect)</text>
    <text x="16" y="240">신주 상장 D-2 권리매도로 숏 포지션과 상계(퉁치기)</text>
  </g>
  <path d="M 16 258 H 424" stroke="currentColor" stroke-width="0.6" opacity="0.25" />

  <!-- 아래: 숏 스퀴즈 -->
  <text x="16" y="282" font-size="13" font-weight="700" fill="currentColor">숏 스퀴즈 — 사냥꾼이 사냥당하는 순간</text>
  <path d="M 40 432 V 292 M 40 432 H 424" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" />
  <path d="M 40 360 H 420" stroke-width="1.3" class="d-accent-stroke" stroke-dasharray="4 3" />
  <text x="46" y="354" font-size="11.5" class="d-accent-t">역산한 공매도 평균 단가 10,000원</text>
  <!-- 주가선 -->
  <path d="M 50 372 L 110 410 L 170 426 L 230 418 L 280 400 L 320 360 L 350 330 L 380 306 L 410 292" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.6" />
  <circle cx="320" cy="360" r="5" class="d-accent" />
  <g font-size="11.5" class="d-pct">
    <text x="110" y="448">70% 바닥 · 대차잔고 최고치</text>
    <text x="330" y="386">기습 호재</text>
  </g>
  <g font-size="12" font-weight="700" class="d-accent-t">
    <text x="196" y="314">숏 커버링</text>
    <text x="196" y="330">강제 매수 → 점상한가</text>
  </g>
  <text x="16" y="474" font-size="11.5" class="d-pct">신호: 주가 급등 + 대차잔고 급감 · 진입: 숏 평단가 돌파 순간</text>
</svg>
