<svg viewBox="0 0 440 324" role="img" aria-label="C기업의 리픽싱 시계열. 최초 전환가 10,000원이 3개월 뒤 9,000원, 6개월 뒤 8,000원, 9개월 뒤 7,000원으로 깎인다. 시가는 6,500원까지 밀렸지만 전환가는 70퍼센트 최저 한도인 7,000원에서 멈춘다. 바닥 확인 직후 재료가 방출되고 주가가 10,000원으로 회복하면 세력의 단가 대비 42.8퍼센트 수익이다">
  <defs>
    <marker id="rfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <!-- 축 -->
  <path d="M 60 20 V 220 H 430" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" marker-end="url(#rfArrow)" />
  <g font-size="11" text-anchor="end" class="d-pct">
    <text x="54" y="54">10,000</text>
    <text x="54" y="94">9,000</text>
    <text x="54" y="134">8,000</text>
    <text x="54" y="174">7,000</text>
    <text x="54" y="194">6,500</text>
  </g>
  <g font-size="11.5" text-anchor="middle" class="d-pct">
    <text x="80" y="238">발행</text>
    <text x="160" y="238">+3개월</text>
    <text x="240" y="238">+6개월</text>
    <text x="320" y="238">+9개월</text>
    <text x="400" y="238">재료 방출</text>
  </g>
  <!-- 70% 바닥선 -->
  <path d="M 60 170 H 424" stroke-width="1.2" class="d-accent-stroke" stroke-dasharray="4 3" />
  <text x="64" y="164" font-size="11" class="d-accent-t">리픽싱 최저 한도 — 최초 발행가의 70%</text>
  <!-- 전환가 계단 (강조) -->
  <path d="M 80 50 H 160 V 90 H 240 V 130 H 320 V 170 H 424" fill="none" stroke-width="2.6" class="d-accent-stroke" />
  <!-- 주가 (회색 꺾은선) -->
  <path d="M 80 50 L 115 70 L 160 92 L 200 100 L 240 132 L 280 150 L 320 190 L 345 182 L 370 150 L 400 50" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
  <!-- 관찰일 점 -->
  <g class="d-accent">
    <circle cx="160" cy="90" r="4" />
    <circle cx="240" cy="130" r="4" />
    <circle cx="320" cy="170" r="4" />
  </g>
  <g font-size="11" class="d-pct">
    <text x="166" y="84">1차 조정</text>
    <text x="246" y="124">2차 조정</text>
    <text x="326" y="186">3차 조정 — 바닥</text>
  </g>
  <!-- 시가 6,500 -->
  <text x="300" y="208" font-size="11" class="d-pct">시가 6,500 · 어닝 쇼크</text>
  <!-- 반등 -->
  <text x="260" y="42" font-size="14" class="d-accent-t" font-weight="700">+42.8%</text>
  <text x="260" y="60" font-size="11.5" class="d-pct">7,000 → 10,000 회복만으로</text>
  <text x="260" y="74" font-size="11.5" class="d-pct">세력과 같은 수익</text>
  <!-- 범례 -->
  <g font-size="11.5">
    <path d="M 60 262 H 84" stroke-width="2.6" class="d-accent-stroke" />
    <text x="90" y="266" fill="currentColor">전환가액 (공시)</text>
    <path d="M 200 262 H 224" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
    <text x="230" y="266" fill="currentColor">주가</text>
  </g>
  <g font-size="11.5" class="d-pct">
    <text x="16" y="294">하락 룸 = (현재 전환가 − 70% 최저한도) ÷ 현재 전환가</text>
    <text x="16" y="311">→ 0이 되는 자리가 1차 진입 타점</text>
  </g>
</svg>
