  </g>
  <text x="1440" y="220" text-anchor="end" font-family="Consolas, 'Courier New', monospace"
        font-size="23" letter-spacing="5" fill="#8A8478">AX ENGINEERING SERIES</text>
  <path d="M160 280h1280" stroke="#191919" stroke-width="1.5" opacity="0.16"/>

  <!-- ── 분류 라벨 ─────────────────────────────────── -->
  <text x="160" y="700" font-family="Consolas, 'Courier New', monospace"
        font-size="27" letter-spacing="9" fill="#C15F3C">SPEC-DRIVEN DEVELOPMENT</text>

  <!-- 마크: 네 겹의 명세가 쌓여 하나의 시스템이 된다 -->
  <g transform="translate(160,772)">
    <rect x="0" y="0"   width="196" height="15" fill="#C15F3C" opacity="0.26"/>
    <rect x="0" y="44"  width="262" height="15" fill="#C15F3C" opacity="0.44"/>
    <rect x="0" y="88"  width="328" height="15" fill="#C15F3C" opacity="0.66"/>
    <rect x="0" y="132" width="394" height="20" fill="url(#stack)"/>
    <path d="M424 142h84" stroke="#C15F3C" stroke-width="3" opacity="0.6"/>
    <path d="M508 142 l-17 -10 v20 z" fill="#C15F3C" opacity="0.6"/>
  </g>

  <!-- ── 제목 ──────────────────────────────────────── -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#191919" font-weight="700">
    <text x="160" y="1210" font-size="146" letter-spacing="-4">Anthropic</text>
    <text x="160" y="1378" font-size="146" letter-spacing="-4">Engineering</text>
    <text x="160" y="1546" font-size="146" letter-spacing="-4">Standard</text>
  </g>

  <path d="M160 1652h280" stroke="#C15F3C" stroke-width="6"/>

