<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2560" width="1600" height="2560">
  <defs>
    <!-- 바탕: 따뜻한 아이보리 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F6F4ED"/>
      <stop offset="0.55" stop-color="#F0EEE6"/>
      <stop offset="1" stop-color="#E8E4D8"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C15F3C" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DFA184" stop-opacity="0.70"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- 명세 격자 -->
  <g stroke="#191919" stroke-width="1" opacity="0.05">
    <path d="M160 0v2560M480 0v2560M800 0v2560M1120 0v2560M1440 0v2560"/>
    <path d="M0 320h1600M0 640h1600M0 960h1600M0 1280h1600M0 1600h1600M0 1920h1600M0 2240h1600"/>
  </g>

  <!-- 판면 시작선 -->
  <path d="M96 300v1960" stroke="#C15F3C" stroke-width="2" opacity="0.32"/>

  <!-- ── 브랜드 로크업 ─────────────────────────────── -->
  <g transform="translate(160,222)">
    <rect x="0" y="-20" width="20" height="20" fill="#C15F3C"/>
    <rect x="26" y="-20" width="8" height="20" fill="#C15F3C" opacity="0.45"/>
    <text x="52" y="-2" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
