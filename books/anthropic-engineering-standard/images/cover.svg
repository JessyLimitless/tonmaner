  <path d="M160 2240h1280" stroke="#191919" stroke-width="1.5" opacity="0.16"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#8A8478">
    <text x="160" y="2334" font-size="22" letter-spacing="2.5">AN INDEPENDENT FIELD GUIDE TO BUILDING WITH CLAUDE CODE</text>
