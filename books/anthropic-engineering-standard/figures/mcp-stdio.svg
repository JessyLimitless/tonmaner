<svg viewBox="0 0 680 300" role="img" aria-label="에이전트 클라이언트가 표준 입출력 기반 JSON-RPC로 파일시스템, 포스트그레스, 퍼피티어 MCP 서버를 자식 프로세스로 스폰해 각각 로컬 볼트, 데이터베이스, 외부 웹에 닿는다">
