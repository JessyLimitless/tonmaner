<svg viewBox="0 0 680 320" role="img" aria-label="네 개의 명세 문서를 꼭짓점에 두면 대조해야 할 쌍은 여섯이 된다. 문서를 다섯으로 늘리면 열, 여섯으로 늘리면 열다섯으로 제곱해 늘어난다">
  <g stroke-width="1.6" class="d-accent-stroke" opacity="0.55">
    <line x1="180" y1="70" x2="500" y2="70" />
    <line x1="180" y1="230" x2="500" y2="230" />
    <line x1="180" y1="70" x2="180" y2="230" />
    <line x1="500" y1="70" x2="500" y2="230" />
    <line x1="180" y1="70" x2="500" y2="230" />
    <line x1="500" y1="70" x2="180" y2="230" />
  </g>
  <g fill="none" stroke-width="2" class="d-accent-stroke">
    <rect x="90" y="48" width="180" height="44" />
    <rect x="410" y="48" width="180" height="44" />
    <rect x="90" y="208" width="180" height="44" />
    <rect x="410" y="208" width="180" height="44" />
  </g>
  <g text-anchor="middle" font-size="11.5" class="d-accent-t">
    <text x="180" y="68">01_PRD.md</text>
    <text x="500" y="68">02_ARCHITECTURE.md</text>
    <text x="180" y="228">03_DATA_SCHEMA.md</text>
    <text x="500" y="228">04_UI_SPEC.md</text>
  </g>
  <g text-anchor="middle" font-size="9.5" class="d-pct">
    <text x="180" y="84">무엇을 · 무엇은 안 함</text>
    <text x="500" y="84">어디서 · 어떤 상태로</text>
    <text x="180" y="244">어떤 값으로 · 어떤 의미로</text>
    <text x="500" y="244">무엇을 보여주는가</text>
  </g>
  <rect x="296" y="134" width="88" height="32" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <text x="340" y="155" text-anchor="middle" font-size="13" class="d-accent-t">6쌍</text>
  <text x="20" y="24" font-size="11" class="d-pct">문서는 넷, 대조해야 할 쌍은 여섯</text>
  <g font-size="10" class="d-pct">
    <text x="20" y="286">문서 4개 → 6쌍</text>
    <text x="160" y="286">5개 → 10쌍</text>
    <text x="280" y="286">6개 → 15쌍</text>
  </g>
  <text x="400" y="286" font-size="10.5" fill="currentColor" opacity="0.7">층위를 더 쪼개는 이득보다 대조 비용이 먼저 터진다</text>
  <text x="20" y="308" font-size="11" class="d-pct">각각은 완벽하고 전체는 틀린 명세 — 이 검증을 건너뛰면 그렇게 된다</text>
</svg>
