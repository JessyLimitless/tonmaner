<svg viewBox="0 0 680 300" role="img" aria-label="라우터가 입력의 의도와 복잡도를 판별해 단순 포맷 변환, 데이터 DDL 생성, 복합 웹 수집 파이프라인 중 하나의 전문 경로로 분기시킨다">
