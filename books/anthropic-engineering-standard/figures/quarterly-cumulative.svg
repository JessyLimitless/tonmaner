<svg viewBox="0 0 680 320" role="img" aria-label="분기 당기금액은 회사에 따라 단독이거나 누계지만 누계 필드는 두 유형에서 일관되므로, 누계 시계열을 먼저 세우고 차분해 단독 분기를 만든다. 재무상태표는 저량이므로 차분하지 않는다">
  <defs>
    <marker id="qcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <text x="20" y="20" font-size="11" class="d-pct">Q1~Q3 값의 의미가 회사마다 갈린다</text>
  <g text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.6">
    <text x="300" y="42">thstrm_amount</text>
  </g>
  <text x="500" y="42" text-anchor="middle" font-size="10.5" class="d-accent-t">thstrm_add_amount</text>
  <g text-anchor="end" font-size="11.5" fill="currentColor">
    <text x="196" y="72">A형 · 9사 중 8사</text>
    <text x="196" y="112">B형 · 1사</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
    <rect x="210" y="50" width="180" height="30" />
    <rect x="210" y="90" width="180" height="30" />
  </g>
  <g fill="none" stroke-width="2" class="d-accent-stroke">
    <rect x="410" y="50" width="180" height="30" />
    <rect x="410" y="90" width="180" height="30" />
  </g>
  <g text-anchor="middle" font-size="11" fill="currentColor">
    <text x="300" y="70">3개월 단독</text>
    <text x="300" y="110">누계</text>
  </g>
  <g text-anchor="middle" font-size="11" class="d-accent-t">
    <text x="500" y="70">누계</text>
    <text x="500" y="110">누계</text>
  </g>
  <text x="600" y="88" font-size="10" class="d-accent-t">일관</text>
  <text x="20" y="146" font-size="11" class="d-pct">그래서 누계를 정본으로 세우고 차분한다</text>
  <g fill="none" stroke-width="2" class="d-accent-stroke">
    <rect x="60" y="158" width="120" height="32" />
    <rect x="200" y="158" width="120" height="32" />
    <rect x="340" y="158" width="120" height="32" />
    <rect x="480" y="158" width="120" height="32" />
  </g>
  <g text-anchor="middle" font-size="11" class="d-accent-t">
    <text x="120" y="179">누계 Q1</text>
    <text x="260" y="179">누계 Q2</text>
    <text x="400" y="179">누계 Q3</text>
    <text x="540" y="179">누계 Q4</text>
  </g>
  <text x="612" y="179" font-size="9.5" class="d-pct">Q4는 thstrm</text>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <line x1="120" y1="190" x2="120" y2="216" marker-end="url(#qcArrow)" />
    <line x1="260" y1="190" x2="260" y2="216" marker-end="url(#qcArrow)" />
    <line x1="400" y1="190" x2="400" y2="216" marker-end="url(#qcArrow)" />
    <line x1="540" y1="190" x2="540" y2="216" marker-end="url(#qcArrow)" />
  </g>
  <g font-size="9.5" class="d-pct">
    <text x="268" y="208">− Q1</text>
    <text x="408" y="208">− Q2</text>
    <text x="548" y="208">− Q3</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
    <rect x="60" y="220" width="120" height="32" />
    <rect x="200" y="220" width="120" height="32" />
    <rect x="340" y="220" width="120" height="32" />
    <rect x="480" y="220" width="120" height="32" />
  </g>
  <g text-anchor="middle" font-size="11" fill="currentColor">
    <text x="120" y="241">단독 Q1</text>
    <text x="260" y="241">단독 Q2</text>
    <text x="400" y="241">단독 Q3</text>
    <text x="540" y="241">단독 Q4</text>
  </g>
  <text x="340" y="274" text-anchor="middle" font-size="10.5" class="d-pct">검증 — 단독 4분기의 합이 연간과 같아야 한다</text>
  <line x1="60" y1="288" x2="620" y2="288" stroke="currentColor" stroke-width="1" opacity="0.25" />
  <text x="340" y="308" text-anchor="middle" font-size="11" fill="currentColor">재무상태표는 차분 금지 — 저량은 기간 발생액이 아니라 시점 잔액이다</text>
</svg>
