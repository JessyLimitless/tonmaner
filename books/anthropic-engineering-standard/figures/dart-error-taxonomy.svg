<svg viewBox="0 0 680 300" role="img" aria-label="같은 HTTP 200 응답 안에서 입력 오류는 즉시 실패시키고, 데이터 없음은 정상 결과로 반환하며, 요청 제한과 시스템 점검만 백오프 재시도한다">
  <defs>
    <marker id="etArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <rect x="200" y="10" width="280" height="44" fill="none" stroke-width="2" class="d-accent-stroke" />
  <text x="340" y="32" text-anchor="middle" font-size="12" class="d-accent-t">HTTP 200 응답</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" class="d-pct">본문 status 필드로 결과가 온다</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <path d="M 340 54 L 340 76 L 116 76 L 116 92" marker-end="url(#etArrow)" />
    <path d="M 340 54 L 340 92" marker-end="url(#etArrow)" />
    <path d="M 340 54 L 340 76 L 564 76 L 564 92" marker-end="url(#etArrow)" />
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
    <rect x="20" y="96" width="192" height="56" />
    <rect x="468" y="96" width="192" height="56" />
  </g>
  <rect x="244" y="96" width="192" height="56" fill="none" stroke-width="2" class="d-accent-stroke" />
  <g text-anchor="middle" font-size="11.5" fill="currentColor">
    <text x="116" y="118">입력 오류</text>
    <text x="564" y="118">일시 장애</text>
  </g>
  <text x="340" y="118" text-anchor="middle" font-size="11.5" class="d-accent-t">데이터 없음</text>
  <g text-anchor="middle" font-size="10.5" class="d-pct">
    <text x="116" y="136">010 · 011 · 100 · 901</text>
    <text x="340" y="136">013</text>
    <text x="564" y="136">020 요청 제한 · 800 점검</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <line x1="116" y1="152" x2="116" y2="176" marker-end="url(#etArrow)" />
    <line x1="564" y1="152" x2="564" y2="176" marker-end="url(#etArrow)" />
  </g>
  <line x1="340" y1="152" x2="340" y2="176" stroke-width="1.6" class="d-accent-stroke" marker-end="url(#etArrow)" />
  <g text-anchor="middle" font-size="11.5" fill="currentColor">
    <text x="116" y="196">즉시 실패</text>
    <text x="564" y="196">지수 백오프 재시도</text>
  </g>
  <text x="340" y="196" text-anchor="middle" font-size="11.5" class="d-accent-t">정상 결과로 반환</text>
  <g text-anchor="middle" font-size="10" class="d-pct">
    <text x="116" y="214">재시도는 예산만 태운다</text>
    <text x="340" y="214">에러가 아니다</text>
    <text x="564" y="214">소진 후에야 실패</text>
  </g>
  <text x="340" y="264" text-anchor="middle" font-size="11" class="d-pct">셋을 한 덩어리로 두면, 자료가 없는 정상 종목이 장애로 둔갑해 보고된다</text>
</svg>
