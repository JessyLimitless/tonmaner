    <text x="146" y="125">· 로깅 및 감사 추적 (Audit Trail)</text>
    <text x="146" y="143">· OpenAI / Anthropic 표준 호환 어댑터</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M 340 148 L 340 168 L 175 168 L 175 194" marker-end="url(#gArrow)" />
    <path d="M 340 148 L 340 168 L 505 168 L 505 194" marker-end="url(#gArrow)" />
