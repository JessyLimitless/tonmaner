<svg viewBox="0 0 680 310" role="img" aria-label="에이전트는 벤더 SDK를 직접 호출하지 않고 사내 LLM 게이트웨이 하나만 바라본다. 게이트웨이는 데이터 민감도에 따라 폐쇄망 내부 sLLM과 인가된 망연계 구간의 전용선 API로 라우팅을 나눈다">
