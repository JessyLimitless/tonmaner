<svg viewBox="0 0 680 300" role="img" aria-label="외부 인터넷망 DMZ의 수집 에이전트가 스크랩하고 정제한 마크다운을 망연계 보안 검증 구간에서 악성코드 검사와 해시 검증을 거쳐 내부 업무망의 데이터베이스와 인덱서로 주입한다">
  <defs>
