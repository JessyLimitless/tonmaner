  <text x="510" y="211" text-anchor="middle" font-size="11.5" fill="currentColor">api_keys 테이블</text>
  <text x="510" y="229" text-anchor="middle" font-size="10" class="d-pct">해시값만 영구 저장 — e3b0c442…</text>
  <text x="20" y="276" font-size="11" class="d-pct">DB 덤프가 유출되어도 키는 복원되지 않는다. 저장하지 않은 것만이 새지 않는다</text>
</svg>
