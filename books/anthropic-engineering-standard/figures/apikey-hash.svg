<svg viewBox="0 0 680 300" role="img" aria-label="API 키는 발급 시점에 원문을 클라이언트에 한 번만 보여주고, 서버는 솔트를 결합한 해시만 데이터베이스에 저장한다">
  <defs>
    <marker id="akArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <rect x="190" y="10" width="300" height="46" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45" />
  <text x="340" y="31" text-anchor="middle" font-size="12" fill="currentColor">API Key 발급 — randomBytes(32)</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" class="d-pct">원문: lm_live_9a8b7c6d…</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <path d="M 340 56 L 340 78 L 170 78 L 170 94" marker-end="url(#akArrow)" />
    <path d="M 340 56 L 340 78 L 510 78 L 510 94" marker-end="url(#akArrow)" />
  </g>
  <rect x="40" y="98" width="260" height="58" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4" />
  <rect x="380" y="98" width="260" height="58" fill="none" stroke-width="2" class="d-accent-stroke" />
  <text x="170" y="122" text-anchor="middle" font-size="11.5" fill="currentColor">클라이언트에 1회성 출력</text>
  <text x="170" y="141" text-anchor="middle" font-size="10" class="d-pct">다시 확인할 수 없다</text>
  <text x="510" y="122" text-anchor="middle" font-size="11.5" class="d-accent-t">SHA-256(key + SALT)</text>
  <text x="510" y="141" text-anchor="middle" font-size="10" class="d-pct">서버 메모리에서 원문 즉시 증발</text>
  <line x1="510" y1="156" x2="510" y2="184" stroke-width="1.6" class="d-accent-stroke" marker-end="url(#akArrow)" />
