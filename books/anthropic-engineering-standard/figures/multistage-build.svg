<svg viewBox="0 0 680 300" role="img" aria-label="의존성 캐시 단계와 애플리케이션 빌드 단계를 거쳐, 최종 실행 이미지에는 컴파일 산출물과 프로덕션 의존성만 복사되어 이미지 크기가 크게 줄어든다">
  <defs>
