<svg viewBox="0 0 680 300" role="img" aria-label="초기에는 컨텍스트 윈도우가 사용자 의도로만 채워지지만, 대화가 열 번 누적되면 의도는 20퍼센트로 줄고 나머지는 에러 로그와 폐기된 접근법, 잡담으로 채워진다">
  <g font-size="12.5" text-anchor="end" fill="currentColor">
