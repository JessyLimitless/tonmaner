    <text x="150" y="182">대화 10회 누적</text>
  </g>
  <g font-size="11" text-anchor="end" fill="currentColor" opacity="0.5">
    <text x="150" y="90">1턴</text>
    <text x="150" y="200">10턴</text>
  </g>
  <rect x="170" y="44" width="480" height="44" class="d-accent" />
  <text x="410" y="118" text-anchor="middle" font-size="12" class="d-accent-t">사용자 의도 100%</text>
  <g>
    <rect x="170" y="154" width="96"  height="44" class="d-accent" />
    <rect x="266" y="154" width="192" height="44" fill="currentColor" opacity="0.5" />
    <rect x="458" y="154" width="144" height="44" fill="currentColor" opacity="0.28" />
    <rect x="602" y="154" width="48"  height="44" fill="currentColor" opacity="0.13" />
  </g>
  <line x1="170" y1="212" x2="266" y2="212" class="d-accent-stroke" stroke-width="2" />
