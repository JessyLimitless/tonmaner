<svg viewBox="0 0 680 300" role="img" aria-label="지능형 라우터가 입력 소스를 판별해 로컬 파일은 인덱싱 체인으로, 웹 URL은 수집 체인으로, 단순 메모는 구조화 체인으로 밀어 넣는다">
  <defs>
    <marker id="kArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <rect x="14" y="118" width="120" height="40" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4" />
  <text x="74" y="143" text-anchor="middle" font-size="11.5" fill="currentColor">입력 요청</text>
  <line x1="134" y1="138" x2="152" y2="138" stroke="currentColor" stroke-width="1.2" opacity="0.5" marker-end="url(#kArrow)" />
  <rect x="156" y="112" width="134" height="52" fill="none" stroke-width="2" class="d-accent-stroke" />
  <text x="223" y="134" text-anchor="middle" font-size="12" class="d-accent-t">지능형 라우터</text>
  <text x="223" y="152" text-anchor="middle" font-size="10" class="d-pct">소스 유형 판별</text>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5">
    <path d="M 290 138 L 310 138 L 310 50 L 326 50" marker-end="url(#kArrow)" />
    <path d="M 290 138 L 326 138" marker-end="url(#kArrow)" />
    <path d="M 290 138 L 310 138 L 310 226 L 326 226" marker-end="url(#kArrow)" />
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
    <rect x="330" y="24" width="330" height="52" />
    <rect x="330" y="112" width="330" height="52" />
    <rect x="330" y="200" width="330" height="52" />
  </g>
  <g font-size="11.5" fill="currentColor">
    <text x="346" y="46">로컬 파일 (.md)</text>
    <text x="346" y="134">웹 URL (HTTP)</text>
    <text x="346" y="222">단순 텍스트 메모</text>
  </g>
  <g font-size="10" class="d-pct">
    <text x="346" y="64">Frontmatter 검증 → 로컬 인덱싱 → 디스크 캐시</text>
    <text x="346" y="152">Puppeteer MCP → 본문 추출 → 태그 생성 → DB</text>
    <text x="346" y="240">마크다운 구조화 → 제목 자동 생성 → 저장</text>
  </g>
  <text x="340" y="282" text-anchor="middle" font-size="11" class="d-pct">라우터가 길을 정하면, 각 체인은 자기 명세에만 집중해 순차 작업을 완결한다</text>
</svg>
