<style>
  /* ── 서체 — 본문과 같은 KoPubWorld. 껍데기만 딴 서체를 쓰지 않는다 ── */
  @font-face{font-family:"KoPubWorld Batang";font-weight:300;font-display:swap;
    src:url("../../../fonts/KoPubWorldBatang-Light.woff2") format("woff2")}
  @font-face{font-family:"KoPubWorld Batang";font-weight:700;font-display:swap;
    src:url("../../../fonts/KoPubWorldBatang-Bold.woff2") format("woff2")}
  @font-face{font-family:"KoPubWorld Dotum";font-weight:500;font-display:swap;
    src:url("../../../fonts/KoPubWorldDotum-Medium.woff2") format("woff2")}
  @font-face{font-family:"KoPubWorld Dotum";font-weight:700;font-display:swap;
    src:url("../../../fonts/KoPubWorldDotum-Bold.woff2") format("woff2")}

  /* ── 리더 UI 팔레트 — 본문 조판과 같은 어법 ───────────── */
  :root{
    --ui-bg:#EFEFF1; --ui-bg2:#E4E4E7; --ui-panel:#FFFFFF; --ui-ink:#18181B;
    --ui-soft:#52525B; --ui-faint:#A1A1AA; --ui-rule:#E4E4E7; --ui-accent:#DC2626;
    --ui-shadow:rgba(20,18,15,.13); --ui-glass:rgba(255,255,255,.82);
  }
  [data-ui="sepia"]{
    --ui-bg:#E2D7C0; --ui-bg2:#D5C8AC; --ui-panel:#F6EFDF; --ui-ink:#3B3226;
    --ui-soft:#7A6E5C; --ui-faint:#A99B84; --ui-rule:#DCD0B8; --ui-accent:#7A5C2E;
    --ui-shadow:rgba(59,50,38,.16); --ui-glass:rgba(246,239,223,.84);
  }
  [data-ui="dark"]{
    --ui-bg:#09090B; --ui-bg2:#050506; --ui-panel:#18181B; --ui-ink:#FAFAFA;
    --ui-soft:#A1A1AA; --ui-faint:#71717A; --ui-rule:#27272A; --ui-accent:#EF4444;
    --ui-shadow:rgba(0,0,0,.6); --ui-glass:rgba(21,23,26,.86);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;color:var(--ui-ink);
    background:radial-gradient(120% 100% at 50% 0%,var(--ui-bg) 0%,var(--ui-bg2) 100%);
    font-family:"KoPubWorld Dotum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-weight:500;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* ── 상단 바 ───────────────────────────────────────── */
  #top{position:fixed;top:0;left:0;right:0;height:44px;z-index:40;
    display:flex;align-items:center;gap:2px;padding:0 12px;
    background:var(--ui-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--ui-rule);
    transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s}
  #top.hide{transform:translateY(-100%);opacity:0}
  #top .title{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--ui-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;letter-spacing:-.2px}
  .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;color:var(--ui-soft);flex:none;
    transition:background .16s,color .16s}
  .ic:hover{background:var(--ui-bg);color:var(--ui-accent)}
  .ic.on{background:var(--ui-accent);color:var(--ui-panel)}
  .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .ic .aa{font:700 15px/1 "KoPubWorld Dotum","Malgun Gothic",sans-serif;letter-spacing:-.5px}

  /* 상단 진행 실선 */
  #prog{position:fixed;top:44px;left:0;right:0;height:2px;z-index:41;
    background:var(--ui-rule);transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s}
  #prog.hide{transform:translateY(-46px);opacity:0}
  #prog i{display:block;height:100%;width:0;background:var(--ui-accent);
    transition:width .25s ease}

  /* ── 무대 ──────────────────────────────────────────── */
  #stage{position:absolute;inset:46px 0 52px 0;display:flex;align-items:stretch;
    transition:inset .3s cubic-bezier(.4,0,.2,1)}
  #paper{flex:1;min-width:0;padding:14px 40px;display:flex;justify-content:center}
  #sheet{position:relative;width:100%;max-width:1160px;
    background:var(--ui-panel);border-radius:3px;
    box-shadow:0 1px 2px var(--ui-shadow),0 14px 40px -12px var(--ui-shadow);
    transition:max-width .3s cubic-bezier(.4,0,.2,1)}
  /* 두 쪽 펼침의 접힘(gutter) */
  #sheet.two::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;
    margin-left:-17px;pointer-events:none;z-index:2;
    background:linear-gradient(90deg,transparent 0%,var(--ui-shadow) 44%,
      transparent 50%,var(--ui-shadow) 56%,transparent 100%);opacity:.55}
  /* 표지 쪽 — 종이를 표지 비율(1600:2560)로 맞춘다. 실제 폭은 applyWidth() 가
     높이에서 계산해 넣는다 — flex 안에서는 aspect-ratio 만으로는 폭이 안 잡힌다 */
  #sheet.coverpage{height:100%;max-width:none;flex:0 0 auto}
  /* 한 쪽 모드 — 한 줄이 너무 길어지면 읽기가 무너진다. 상한은 applyWidth()가 잡는다 */
  #sheet.single{max-width:760px}
  #paper.coverpaper{padding:14px 0}
  /* 페이지 엣지 — 러닝헤드와 쪽번호. 실제 책의 판면 가장자리 */
  #edges{position:absolute;inset:0;z-index:3;pointer-events:none;
    font-family:"KoPubWorld Batang",serif;font-weight:300;
    font-size:11.5px;letter-spacing:.02em;color:var(--ui-faint);opacity:0;
    transition:opacity .25s}
  #edges.on{opacity:1}
  #edges span{position:absolute;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:38%}
  .rh-r{top:14px;right:7%;text-align:right;max-width:46%}
  .pn-l{bottom:14px;left:7%;font-variant-numeric:tabular-nums}
  .pn-r{bottom:14px;right:7%;font-variant-numeric:tabular-nums}
  #viewer{width:100%;height:100%;transition:opacity .16s ease}
  #viewer.turning{opacity:.25}

  /* ── 페이지 터너 ───────────────────────────────────── */
  .turner{position:fixed;top:50%;margin-top:-24px;width:48px;height:48px;z-index:35;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--ui-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--ui-rule);color:var(--ui-soft);
    box-shadow:0 3px 14px -4px var(--ui-shadow);
    opacity:0;transition:opacity .2s,transform .2s,background .16s,color .16s}
  body:hover .turner{opacity:.82}
  .turner:hover{opacity:1;color:var(--ui-accent);transform:scale(1.07)}
  .turner:active{transform:scale(.94)}
  .turner svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  #prev{left:16px} #next{right:16px}

  /* ── 하단 바 ───────────────────────────────────────── */
  #bot{position:fixed;bottom:0;left:0;right:0;height:52px;z-index:40;
    padding:8px 22px 9px;background:var(--ui-glass);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--ui-rule);
    transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s}
  #bot.hide{transform:translateY(100%);opacity:0}
  #bot .row{display:flex;align-items:baseline;gap:14px;font-size:11.5px;color:var(--ui-faint)}
  #chap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:var(--ui-soft);letter-spacing:-.1px}
  #pg{font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--ui-faint)}
  #pct{font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--ui-soft);font-weight:700}
  #range{width:100%;margin:9px 0 0;-webkit-appearance:none;appearance:none;height:3px;
    border-radius:2px;background:var(--ui-rule);outline:none;cursor:pointer}
  #range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ui-accent);border:3px solid var(--ui-panel);
    box-shadow:0 1px 4px var(--ui-shadow)}
  #range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ui-accent);
    border:3px solid var(--ui-panel)}

  /* ── 목차 서랍 ─────────────────────────────────────── */
  #scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .24s}
  #scrim.open{opacity:1;pointer-events:auto}
  #toc{position:fixed;top:0;bottom:0;left:0;width:340px;max-width:86vw;z-index:60;
    background:var(--ui-panel);border-right:1px solid var(--ui-rule);
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:4px 0 28px -8px var(--ui-shadow)}
  #toc.open{transform:none}
  #toc h2{margin:0;padding:19px 20px;font-size:11.5px;font-weight:700;letter-spacing:.2em;
    color:var(--ui-faint);border-bottom:1px solid var(--ui-rule)}
  #toclist{flex:1;overflow-y:auto;padding:10px 0 24px}
  #toclist a{display:block;padding:10px 20px;font-size:13px;line-height:1.55;
    color:var(--ui-ink);text-decoration:none;border-left:2px solid transparent;
    transition:background .14s}
  #toclist a:hover{background:var(--ui-bg)}
  #toclist a.cur{border-left-color:var(--ui-accent);color:var(--ui-accent);font-weight:700}
  #toclist a.lv2{padding-left:38px;font-size:12px;color:var(--ui-soft)}

  /* ── 설정 패널 ─────────────────────────────────────── */
  #set{position:fixed;top:52px;right:12px;z-index:60;width:306px;padding:18px;
    background:var(--ui-panel);border:1px solid var(--ui-rule);border-radius:12px;
    box-shadow:0 12px 40px -10px var(--ui-shadow);
    opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
    transition:opacity .18s,transform .18s}
  #set.open{opacity:1;transform:none;pointer-events:auto}
  #set .grp{margin-bottom:18px}
  #set .grp:last-child{margin-bottom:0}
  #set label{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;letter-spacing:.14em;color:var(--ui-faint);
    margin-bottom:9px;font-weight:700}
  #set label b{font-size:11.5px;letter-spacing:0;color:var(--ui-soft);
    font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px 0;font-size:12px;color:var(--ui-soft);
    border:1px solid var(--ui-rule);border-radius:7px;background:transparent;
    transition:background .14s,color .14s,border-color .14s}
  .seg button:hover{background:var(--ui-bg)}
  .seg button[aria-pressed="true"]{background:var(--ui-accent);color:var(--ui-panel);
    border-color:var(--ui-accent)}
  /* 글자 크기 스테퍼 */
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:40px;height:38px;border:1px solid var(--ui-rule);border-radius:7px;
    color:var(--ui-soft);transition:background .14s,color .14s}
  .step button:hover{background:var(--ui-bg);color:var(--ui-accent)}
  .step button:disabled{opacity:.35;cursor:default;background:none;color:var(--ui-soft)}
  .step .bar{flex:1;height:3px;border-radius:2px;background:var(--ui-rule);position:relative}
  .step .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;
    background:var(--ui-accent);transition:width .18s}
  .step .s{font-size:12px}.step .l{font-size:17px;font-weight:700}
  #hint{margin-top:16px;padding-top:13px;border-top:1px solid var(--ui-rule);
    font-size:10.5px;line-height:2;color:var(--ui-faint);letter-spacing:.02em}
  #hint kbd{font:inherit;font-weight:700;color:var(--ui-soft);
    border:1px solid var(--ui-rule);border-radius:4px;padding:1px 5px;margin-right:2px}

  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:70;background:var(--ui-bg);color:var(--ui-soft);font-size:13px;
    text-align:center;padding:2em;line-height:1.9}
  @media (max-width:820px){
    #paper{padding:12px 14px}
    .turner{width:40px;height:40px;opacity:.5}
    #prev{left:6px} #next{right:6px}
    #set{right:8px;left:8px;width:auto}
  }
  /* 손가락 기기 — 화살표 버튼이 본문 첫 글자를 가린다. 밀기·가장자리 탭으로 넘긴다 */
  @media (hover:none) and (pointer:coarse){
    .turner{display:none}
  }
  html,body{overscroll-behavior:none}
  #stage{touch-action:pan-y pinch-zoom}
  #hint{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:60;
    padding:9px 16px;border-radius:20px;font-size:13px;white-space:nowrap;
    background:var(--ui-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--ui-rule);color:var(--ui-soft);
    box-shadow:0 3px 14px -4px var(--ui-shadow);opacity:0;pointer-events:none;
    transition:opacity .4s}
  #hint.on{opacity:1}
</style></head><body>

<div id="top">
  <button class="ic" id="bToc" title="목차 (T)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var msg = $('#msg');
if (!window.ePub) { msg.textContent = 'epub.js를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; return; }

var KEY = 'reader:메자닌 코드';
var FONTS = [85, 95, 100, 110, 125, 140, 160];
var cfg = {theme:'light', font:95, lead:1.9, spread:'auto', pad:'2.8/5',
           wide:'1160', edge:'full', cfi:null, mark:null};
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
var PAD_MIGRATE = {'1.6/2':'2/3.2', '2.6/3.4':'2.8/5', '3.6/5.2':'3.6/7'};
if (PAD_MIGRATE[cfg.pad]) cfg.pad = PAD_MIGRATE[cfg.pad];
var WIDE_MIGRATE = {'1080':'1160'};
if (WIDE_MIGRATE[String(cfg.wide)]) cfg.wide = WIDE_MIGRATE[String(cfg.wide)];
var LEAD_MIGRATE = {'1.6':'1.7', '1.82':'1.9', '2.1':'2.15'};
if (LEAD_MIGRATE[String(cfg.lead)]) cfg.lead = +LEAD_MIGRATE[String(cfg.lead)];
if (!cfg.edge) cfg.edge = 'full';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }

/* 본문(iframe) 팔레트 — book.css 의 :root 변수를 덮어쓴다 */
var PALETTE = {
  light:{page:'#FFFFFF',ink:'#18181B',soft:'#52525B',faint:'#A1A1AA',rule:'#E4E4E7',rule2:'#D4D4D8',accent:'#DC2626',wash:'#F4F4F5'},
  sepia:{page:'#F6EFDF',ink:'#3B3226',soft:'#7A6E5C',faint:'#A99B84',rule:'#E3D8C2',rule2:'#CFC0A2',accent:'#7A5C2E',wash:'#EFE6D2'},
  dark: {page:'#18181B',ink:'#FAFAFA',soft:'#A1A1AA',faint:'#71717A',rule:'#27272A',rule2:'#3F3F46',accent:'#EF4444',wash:'#27272A'}
};

var book = ePub('book.epub');
var rendition = book.renderTo('viewer', {
  width:'100%', height:'100%',
  flow: cfg.spread === 'scrolled' ? 'scrolled-doc' : 'paginated',
  spread: cfg.spread === 'scrolled' ? 'none' : cfg.spread,
  allowScriptedContent:false
});

/* 여백 설정 — 위아래는 em, 좌우는 쪽 폭에 대한 비율.
   좌우를 em 으로 두면 '좁게' 폭에서 판면이 무너진다(쪽이 좁아져도 여백은 그대로라서).
   비율로 두면 어느 폭에서도 책의 판면 비례가 유지된다. */
var PADS = {'2/3.2':{h:.085}, '2.8/5':{h:.13}, '3.6/7':{h:.17}};
function padH(){ return (PADS[cfg.pad] || PADS['2.8/5']).h; }

/* 두 쪽 펼침 여부 — 지금 종이의 폭이 아니라 '앞으로 잡힐 폭'으로 판단한다.
   표지에서는 종이가 표지 비율(434px)로 좁아져 있어, 현재 폭을 보면 본문으로
   넘어갈 때 한 쪽 모드로 잘못 떨어진다. */
function paperInner(){
  var pa = $('#paper');
  var cs = getComputedStyle(pa);
  return pa.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
}
function twoWanted(want){
  if ((want || cfg.spread) !== 'auto') return false;
  var w = +cfg.wide;
  return Math.min(w >= 9000 ? 99999 : w, paperInner()) > 900;
}

/* 종이 폭 상한 — 높이가 천장이라 폭만 키우면 한 쪽이 정사각형이 된다.
   한 쪽의 가로세로 비가 0.95 를 넘지 않게 잡는다. */
function widthCap(){
  if (cfg.spread === 'scrolled') return 99999;   /* 세로로 흐르므로 비례를 잴 쪽이 없다 */
  var st = $('#stage').getBoundingClientRect();
  var h = st.height - 28;                       /* #paper 의 상하 패딩 */
  var two = $('#sheet').classList.contains('two');
  return Math.round(h * (two ? 2 : 1) * 0.95);
}

function applyWidth(force){
  var sh = $('#sheet');
  /* 표지는 제 비율(1600:2560)로 높이에 맞춘다 — 폭 상한을 걸면 종이가 잘린다 */
  if (sh.classList.contains('coverpage')) {
    var ch = $('#paper').clientHeight - 28;
    var cw = Math.round(ch * 1600 / 2560);
    /* 폰은 높이가 아니라 폭이 천장이다 — 높이로만 재면 표지가 화면 밖으로 삐져나간다
       (390px 폰에서 421px). 폭에 걸리면 높이를 표지 비율로 줄이고 세로 가운데에 둔다. */
    var pw = paperInner();
    sh.style.maxWidth = 'none';
    if (cw > pw) {
      sh.style.width = pw + 'px';
      sh.style.height = Math.round(pw * 2560 / 1600) + 'px';
      sh.style.alignSelf = 'center';
    } else {
      sh.style.width = cw + 'px';
      sh.style.height = ''; sh.style.alignSelf = '';
    }
    relayout(force); return;
  }
  sh.style.width = ''; sh.style.height = ''; sh.style.alignSelf = '';
  var w = +cfg.wide;
  var eff = Math.min(w >= 9000 ? 99999 : w, widthCap());
  if (sh.classList.contains('single')) eff = Math.min(eff, 760);
  sh.style.maxWidth = eff + 'px';
  relayout(force);
}

/* epub.js 는 본문 좌우 패딩을 제 gap 계산(폭÷12)으로 덮어쓴다.
   그래서 테마의 padding 만으로는 좌우 여백이 바뀌지 않는다 — gap 을 직접 넘긴다.
   ⚠️ epub.js 의 resize() 는 무대 크기가 그대로면 그냥 돌아간다(조판을 다시 하지 않는다).
   그래서 폭이 안 바뀐 채 여백만 바꿀 때는 _stageSize 를 지워 강제로 다시 재게 한다.
   되돌아오는 relocated 경로에서는 force 를 주지 않는다 — 주면 재조판이 끝없이 돈다. */
var rlT, curGap = 0;
function relayout(force){
  clearTimeout(rlT);
  rlT = setTimeout(function(){
    var sh = $('#sheet');
    var page = sh.clientWidth / (sh.classList.contains('two') ? 2 : 1);
    var g = Math.round(page * padH() * 2);
    /* 좁은 화면에서는 비율을 그대로 쓰면 글줄이 무너진다 — 본문 폭 300px 을 지킨다 */
    g = Math.min(g, Math.max(0, Math.round(page) - 300));
    if (g % 2) g -= 1;
    if (g < 0) g = 0;
    /* 표지는 그림이 종이를 꽉 채워야 한다 — epub.js 가 gap 으로 넣는
       좌우 패딩이 표지 둘레에 흰 띠를 만든다 */
    if (sh.classList.contains('coverpage')) g = 0;
    curGap = g;
    try {
      rendition.settings.gap = g;
      if (rendition.manager) {
        rendition.manager.settings.gap = g;
        if (force) rendition.manager._stageSize = undefined;
      }
      rendition.resize();
    } catch(e){}
  }, 320);
}

function applyTheme(){
  var p = PALETTE[cfg.theme] || PALETTE.light;
  document.documentElement.setAttribute('data-ui', cfg.theme);
  var pd = String(cfg.pad).split('/');
  var rules = {
    /* 가로 밀기를 브라우저가 스크롤로 가져가면 touchend 대신 touchcancel 이 와서
       쪽이 안 넘어간다 — 가로는 리더가 받는다 */
    'html':{'touch-action':'pan-y pinch-zoom !important'},
    ':root':{'--page':p.page,'--ink':p.ink,'--soft':p.soft,'--faint':p.faint,
             '--rule':p.rule,'--rule-2':p.rule2,'--accent':p.accent,'--wash':p.wash},
    'body':{'background':p.page+' !important','color':p.ink+' !important',
            'line-height':String(cfg.lead)+' !important',
            'max-width':'none !important',
            'padding':pd[0]+'em '+pd[1]+'em !important'},
    'body#cover':{'padding':'0 !important','margin':'0 !important','max-width':'none !important'},
    'body#cover #cover-image':{'height':'100% !important','width':'100% !important'},
    'body#cover svg, body#cover #cover-image img':
      {'width':'100% !important','height':'100% !important','display':'block !important',
       'max-width':'none !important','max-height':'none !important'},
    'img':{'max-width':'100% !important'},
    /* epub.js 가 svg 에 max-width: 칼럼폭x0.65 를 !important 로 박는다 —
       그래서 도해가 판면의 65% 로만 그려졌다. 더 높은 특이도로 되돌린다. */
    'figure.diagram svg':{'width':'100% !important','max-width':'100% !important',
                          'height':'auto !important','max-height':'76vh !important'}
  };
  /* 좁은 화면(폰) — 도해만 판면 여백까지 넓힌다. 글줄은 그대로 둔다.
     book.css 의 @media 는 여기서 쓸 수 없다 — 쪽 넘김 iframe 의 innerWidth 는
     한 쪽이 아니라 전체 단(段) 길이(폰에서도 3,620px)라 미디어쿼리가 안 걸린다. */
  var sh = $('#sheet');
  var pageW = sh.clientWidth / (sh.classList.contains('two') ? 2 : 1);
  if (pageW < 430 && curGap > 0) {
    var bl = Math.round(curGap / 2);
    rules['figure.diagram'] = {'margin-left':(-bl)+'px !important',
                               'margin-right':(-bl)+'px !important'};
    rules['figure.diagram figcaption'] = {'padding-left':bl+'px !important',
                                          'padding-right':bl+'px !important'};
  }
  rendition.themes.register('cur', rules);
  rendition.themes.select('cur');
  rendition.themes.fontSize(cfg.font + '%');
  $('#sheet').style.background = p.page;
}

rendition.display(cfg.cfi || undefined).then(function(){
  msg.remove();
  applyTheme(); applyWidth(true);
}).catch(function(e){ msg.textContent = 'EPUB을 여는 데 실패했습니다: ' + e; });

/* 표지는 항상 한 쪽으로 — 2단 조판에서 한 단만 채우면 반쪽이 빈다 */
var curSpread = null;
function syncSpread(href){
  var onCover = /cover/i.test(href || '');
  $('#sheet').classList.toggle('coverpage', onCover && cfg.spread !== 'scrolled');
  $('#paper').classList.toggle('coverpaper', onCover && cfg.spread !== 'scrolled');
  if (cfg.spread === 'scrolled') { $('#sheet').classList.remove('two'); return; }
  var want = onCover ? 'none' : cfg.spread;
  if (want !== curSpread) { curSpread = want; rendition.spread(want); }
  var two = twoWanted(want);
  $('#sheet').classList.toggle('two', two);
  $('#sheet').classList.toggle('single', !onCover && want === 'none');
  applyWidth();
}

/* ── 목차 ─────────────────────────────────────────── */
var tocLinks = [];
book.loaded.navigation.then(function(nav){
  var box = $('#toclist');
  (nav.toc || []).forEach(function(item){
    add(item, 1);
    (item.subitems || []).forEach(function(s){ add(s, 2); });
  });
  function add(item, lv){
    var a = document.createElement('a');
    a.textContent = item.label.trim();
    a.href = '#'; a.dataset.href = item.href;
    if (lv === 2) a.className = 'lv2';
    a.onclick = function(ev){ ev.preventDefault(); rendition.display(item.href); closeToc(); };
    box.appendChild(a); tocLinks.push(a);
  }
});

/* ── 진행률 ───────────────────────────────────────── */
var ready = false;
book.ready.then(function(){ return book.locations.generate(1200); })
  .then(function(){ ready = true; });

rendition.on('relocated', function(loc){
  cfg.cfi = loc.start.cfi; save();
  syncSpread(loc.start.href);
  var pct = ready ? book.locations.percentageFromCfi(loc.start.cfi) : (loc.start.percentage || 0);
  pct = Math.max(0, Math.min(1, pct || 0));
  $('#pct').textContent = Math.round(pct * 100) + '%';

  var pl = 0, pr = 0, tot = 0;
  if (ready) {
    try {
      pl = book.locations.locationFromCfi(loc.start.cfi) + 1;
      pr = book.locations.locationFromCfi(loc.end.cfi) + 1;
      tot = book.locations.total;
    } catch(e){}
  }
  $('#pg').textContent = tot ? (pl + ' / ' + tot + ' 쪽') : '';
  $('#range').value = Math.round(pct * 1000);
  $('#prog i').style.width = (pct * 100) + '%';
  var href = loc.start.href, cur = '';
  tocLinks.forEach(function(a){
    var hit = a.dataset.href && a.dataset.href.split('#')[0] === href.split('/').pop();
    a.classList.toggle('cur', !!hit);
    if (hit && !cur) cur = a.textContent;
  });
  $('#chap').textContent = cur || '—';

  /* 페이지 엣지 — 표지와 스크롤 모드에서는 걷어낸다 */
  var onCover = /cover/i.test(href || '');
  var show = !onCover && cfg.spread !== 'scrolled' && cfg.edge !== 'off';
  $('#edges').classList.toggle('on', show);
  if (show) {
    var two = $('#sheet').classList.contains('two');
    var head = (cur || '').split(/\s[—–-]\s/)[0].trim();
    $('.rh-r').textContent = cfg.edge === 'full' ? head : '';
    $('.pn-l').textContent = (tot && two) ? String(pl) : '';
    $('.pn-r').textContent = tot ? String(two ? pr : pl) : '';
  }
});

$('#range').oninput = function(){
  if (!ready) return;
  rendition.display(book.locations.cfiFromPercentage(this.value / 1000));
};

/* ── 쪽 넘김 ──────────────────────────────────────── */
var busy = false;
function turn(d){
  if (busy) return; busy = true;
  var v = $('#viewer'); v.classList.add('turning');
  var p = d < 0 ? rendition.prev() : rendition.next();
  Promise.resolve(p).then(function(){
    setTimeout(function(){ v.classList.remove('turning'); busy = false; }, 60);
  }).catch(function(){ v.classList.remove('turning'); busy = false; });
}
$('#prev').onclick = function(){ turn(-1); };
$('#next').onclick = function(){ turn(1); };

/* 폰 — 옆으로 밀거나 가장자리(좌우 30%)를 눌러 넘긴다.
   본문은 epub.js iframe 안에 있어 부모 문서로 터치가 올라오지 않는다 —
   rendition.on 으로 받는다. iframe 안 좌표는 단(段) 전체 기준이라
   가장자리 판정은 iframe 의 화면 위치를 더해 부모 좌표로 바꾼다. */
var touch0 = null;
function tX(e, t){
  var fe = e.view && e.view.frameElement;
  return fe ? fe.getBoundingClientRect().left + t.clientX : t.clientX;
}
function tStart(e){
  var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
  touch0 = {x:t.clientX, y:t.clientY, px:tX(e,t), at:Date.now()};
}
function tEnd(e){
  var t = e.changedTouches && e.changedTouches[0];
  if (!t || !touch0) return;
  var dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, dt = Date.now() - touch0.at;
  var px = touch0.px; touch0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) {
    turn(dx < 0 ? 1 : -1); return;
  }
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400) {
    var el = e.target;
    if (el && el.closest && el.closest('a,button,input,label,select')) return;
    var W = window.innerWidth;
    if (px < W * 0.3) turn(-1);
    else if (px > W * 0.7) turn(1);
  }
}
function tMove(e){
  var t = e.changedTouches && e.changedTouches[0];
  if (t && touch0) touch0.last = {clientX:t.clientX, clientY:t.clientY};
}
function tCancel(e){
  if (!touch0 || !touch0.last) { touch0 = null; return; }
  tEnd({changedTouches:[touch0.last], target:null, view:e.view});
}
rendition.on('touchstart', tStart);
rendition.on('touchmove', tMove);
rendition.on('touchend', tEnd);
rendition.hooks.content.register(function(c){
  c.document.addEventListener('touchcancel', tCancel);
});
$('#stage').addEventListener('touchstart', tStart, {passive:true});
$('#stage').addEventListener('touchmove', tMove, {passive:true});
$('#stage').addEventListener('touchend', tEnd);
$('#stage').addEventListener('touchcancel', tCancel);

/* 처음 온 손가락 기기에만 한 번 — 버튼을 숨겼으니 넘기는 법을 알려 준다 */
if (window.matchMedia && matchMedia('(hover:none) and (pointer:coarse)').matches) {
  var seen = false; try { seen = localStorage.getItem('reader-hint') === '1'; } catch(e){}
  if (!seen) {
    var hn = document.createElement('div'); hn.id = 'hint';
    hn.textContent = '옆으로 밀거나 가장자리를 눌러 넘기세요';
    document.body.appendChild(hn);
    setTimeout(function(){ hn.classList.add('on'); }, 900);
    setTimeout(function(){ hn.classList.remove('on'); }, 4600);
    try { localStorage.setItem('reader-hint', '1'); } catch(e){}
  }
}

/* ── 서랍·패널 ────────────────────────────────────── */
function openToc(){ $('#toc').classList.add('open'); $('#scrim').classList.add('open'); }
function closeToc(){ $('#toc').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#bToc').onclick = function(){ $('#toc').classList.contains('open') ? closeToc() : openToc(); };
$('#scrim').onclick = function(){ closeToc(); closeSet(); };

function closeSet(){ $('#set').classList.remove('open'); $('#bSet').classList.remove('on'); }
$('#bSet').onclick = function(e){
  e.stopPropagation();
  var open = $('#set').classList.toggle('open');
  $('#bSet').classList.toggle('on', open);
};
document.addEventListener('click', function(e){
  if (!$('#set').contains(e.target) && !$('#bSet').contains(e.target)) closeSet();
});

/* 세그먼트 버튼 공통 */
function seg(id, get, fn){
  var box = $(id);
  function paint(){
    [].forEach.call(box.children, function(x){
      x.setAttribute('aria-pressed', String(String(x.dataset.v) === String(get())));
    });
  }
  box.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    fn(b.dataset.v); paint(); save();
  };
  paint();
}
seg('#gTheme', function(){ return cfg.theme; }, function(v){ cfg.theme = v; applyTheme(); });
seg('#gLead',  function(){ return cfg.lead;  }, function(v){ cfg.lead = +v; applyTheme(); });
seg('#gPad',   function(){ return cfg.pad;   }, function(v){ cfg.pad = v; applyTheme(); relayout(true); });
seg('#gWide',  function(){ return cfg.wide;  }, function(v){ cfg.wide = v; applyWidth(true); });
seg('#gEdge',  function(){ return cfg.edge;  }, function(v){
  cfg.edge = v;
  if (rendition.location) rendition.emit('relocated', rendition.location);
});
seg('#gSpread',function(){ return cfg.spread;}, function(v){
  cfg.spread = v;
  rendition.flow(v === 'scrolled' ? 'scrolled-doc' : 'paginated');
  curSpread = v === 'scrolled' ? 'none' : v;
  rendition.spread(curSpread);
  $('#sheet').classList.toggle('two', twoWanted(v));
  applyTheme(); applyWidth(true);
});

/* 글자 크기 스테퍼 */
function paintFont(){
  var i = FONTS.indexOf(cfg.font); if (i < 0) i = 2;
  $('#vFont').textContent = cfg.font + '%';
  $('#fBar').style.width = ((i / (FONTS.length - 1)) * 100) + '%';
  $('#fDn').disabled = i === 0;
  $('#fUp').disabled = i === FONTS.length - 1;
}
function stepFont(d){
  var i = FONTS.indexOf(cfg.font); if (i < 0) i = 2;
  i = Math.max(0, Math.min(FONTS.length - 1, i + d));
  cfg.font = FONTS[i]; paintFont(); applyTheme(); save();
}
$('#fDn').onclick = function(){ stepFont(-1); };
$('#fUp').onclick = function(){ stepFont(1); };
paintFont();

/* 북마크 */
$('#bMark').onclick = function(){
  if (cfg.mark) { rendition.display(cfg.mark); cfg.mark = null; $('#bMark').classList.remove('on'); }
  else { cfg.mark = cfg.cfi; $('#bMark').classList.add('on'); }
  save();
};
if (cfg.mark) $('#bMark').classList.add('on');

/* 몰입 모드 — UI를 걷어내고 화면 전체를 종이로 */
var bare = false;
$('#bFull').onclick = function(){
  bare = !bare;
  $('#top').classList.toggle('hide', bare);
  $('#prog').classList.toggle('hide', bare);
  $('#bot').classList.toggle('hide', bare);
  $('#stage').style.inset = bare ? '0' : '';
  $('#bFull').classList.toggle('on', bare);
  if (bare && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(function(){});
  } else if (!bare && document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(function(){});
  }
  applyWidth(true);
};

/* 창 크기 변화 대응 */
var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    $('#sheet').classList.toggle('two', twoWanted());
    applyWidth(true);
  }, 180);
});

/* 키보드 */
function key(e){
  if (e.key === 'ArrowLeft')  turn(-1);
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); turn(1); }
  if (e.key === 't' || e.key === 'T') $('#bToc').click();
  if (e.key === 's' || e.key === 'S') $('#bSet').click();
  if (e.key === 'b' || e.key === 'B') $('#bMark').click();
  if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  if (e.key === '+' || e.key === '=') stepFont(1);
  if (e.key === '-' || e.key === '_') stepFont(-1);
  if (e.key === 'Escape') { closeToc(); closeSet(); }
}
document.addEventListener('keydown', key);
rendition.on('keydown', key);          /* iframe 안에서도 먹도록 */
rendition.on('rendered', function(){ applyTheme(); });
})();
</script></body></html>
